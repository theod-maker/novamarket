name: novamarket-s1
services:
  postgres:
    image: postgres:17.12-bookworm@sha256:837bed18782820fe967067cb5328b02b0d9992c1be9a37ee0c9c492cfc03af3b
    environment:
      POSTGRES_DB: novamarket
      POSTGRES_USER: atelier
      POSTGRES_PASSWORD: novamarket_s1_local
    ports:
      - "127.0.0.1:${NOVAMARKET_PG_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./s1:/s1:ro
    mem_limit: 2g
    cpus: 2
    healthcheck:
      test: ["CMD", "pg_isready", "-h", "127.0.0.1", "-U", "atelier", "-d", "novamarket"]
      interval: 2s
      timeout: 3s
      retries: 30
  dbt:
    profiles: [transfo]
    build: ./s4
    working_dir: /work
    environment:
      HOME: /tmp
      DBT_SEND_ANONYMOUS_USAGE_STATS: "false"
    volumes:
      - ./s4/travail:/work
      - ./s4/exemple:/exemple:ro
    mem_limit: 1g
    cpus: 2
  metabase:
    profiles: [bi]
    image: metabase/metabase:v0.64.8@sha256:4887880d980f8faf89c21689dfbbd71981585434e6ebfa819d73724ff338b5d6
    environment:
      MB_DB_TYPE: postgres
      MB_DB_HOST: postgres
      MB_DB_PORT: 5432
      MB_DB_DBNAME: ${NOVAMARKET_MB_APP_DB:-metabase_s6_app}
      MB_DB_USER: metabase_s6_app
      MB_DB_PASS: ${NOVAMARKET_MB_APP_PASSWORD:-s6_app_local}
      MB_ANON_TRACKING_ENABLED: "false"
      JAVA_TOOL_OPTIONS: "-Xmx1g -XX:ActiveProcessorCount=2"
    ports:
      - "127.0.0.1:${NOVAMARKET_MB_PORT:-13000}:3000"
    mem_limit: 2g
    cpus: 2
volumes:
  postgres_data:
networks:
  default:
    ipam:
      config:
        - subnet: ${NOVAMARKET_SUBNET:-10.244.172.0/24}
